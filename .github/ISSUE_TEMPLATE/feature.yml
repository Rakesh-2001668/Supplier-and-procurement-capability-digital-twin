name: Feature or missing workflow
description: A requirement from the Blueprint or Technical Document that is not built yet, or a new request
title: "[Feature] "
labels: ["type: feature", "status: triage"]
body:
  - type: input
    id: spec
    attributes:
      label: Spec reference
      placeholder: BP M10, TD section 12.3, or an item number from docs/PIC_Pending_Workflows.md
  - type: textarea
    id: need
    attributes:
      label: What is needed and why
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ...\n- [ ] a test covers it"
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Rough size
      options:
        - "S: up to 1 day"
        - "M: 2-5 days"
        - "L: 1-3 weeks"
  - type: checkboxes
    id: client
    attributes:
      label: Blocked by the client
      options:
        - label: Needs a client system, credential, data or decision
