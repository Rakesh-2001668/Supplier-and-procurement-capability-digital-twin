name: CI

# Quality and supply-chain gates on every push to main and every pull request.
# Security scanning (secrets, CodeQL, ZAP) lives in security.yml; image publishing in release.yml;
# database deploys only in neon.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pic_test
      PIC_JWT_SECRET: ci-only-secret
      PIC_FIELD_KEY: ci-only-field-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The code uses uuid.uuid7() (Python 3.14+); keep in step with backend/Dockerfile.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly
        run: DATABASE_URL=$TEST_DATABASE_URL python -m alembic -c alembic_pic.ini upgrade head
      - name: Tests (RLS, SoD, idempotency, signature case, production readiness)
        run: python -m pytest tests/pic -q
      - name: Production configuration is refused when unsafe
        run: |
          set +e
          PIC_ENV=production DATABASE_URL=postgresql://x@localhost/x PIC_JWT_SECRET=short PIC_FIELD_KEY=bad \
            python -c "from app.pic.config import get_settings; get_settings()" 2> refusal.txt
          code=$?
          set -e
          cat refusal.txt | tail -8
          test $code -ne 0 && grep -q "Refusing to start with PIC_ENV=production" refusal.txt

  dependency-audit-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pip-audit==2.9.0
      - name: pip-audit (fails on HIGH/CRITICAL not in backend/pip-audit-ignore.txt)
        run: |
          pip-audit -r backend/requirements.txt -f json -o pip-audit.json --progress-spinner off || true
          test -s pip-audit.json
          python .github/scripts/pip_audit_gate.py pip-audit.json backend/pip-audit-ignore.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit
          path: pip-audit.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint (PIC workspace)
        # Scope: every PIC screen and component, plus the proxy, config and BFF routes (no exclusions since 30 Oct 2026).
        run: >-
          npx eslint
          src/app/pic src/components/pic src/lib/pic src/app/api src/proxy.ts next.config.ts
      - name: npm audit (production dependencies, fails on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all dependencies, report only)
        run: npm audit --audit-level=high || true
      - name: Build (production flags)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_PIC_ENV: production

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: pic-api:ci
          cache-from: type=gha,scope=pic-api
          cache-to: type=gha,mode=max,scope=pic-api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: pic-web:ci
          cache-from: type=gha,scope=pic-web
          cache-to: type=gha,mode=max,scope=pic-web
      - name: API image runs as non-root and refuses unsafe production config
        run: |
          test "$(docker run --rm --entrypoint id pic-api:ci -u)" = "10001"
          if docker run --rm -e DATABASE_URL=postgresql://x@db/x -e PIC_JWT_SECRET=short -e PIC_FIELD_KEY=bad pic-api:ci \
               python -c "import app.main"; then echo "::error::unsafe production config was accepted"; exit 1; fi
