name: Release images

# Builds and pushes the API/worker image and the web image to GitHub Container Registry on every push to main:
#   ghcr.io/<owner>/pic-api:<git sha> and :latest
#   ghcr.io/<owner>/pic-web:<git sha> and :latest
# Database migrations are NOT run here: neon.yml applies `alembic upgrade head` (and the idempotent setup) on the same push to
# main. Migrations must stay backward-compatible for one release (docs/runbooks/release-and-rollback.md), so the order in which
# the two workflows finish does not matter. Deploy by pinning the sha tag (deploy/k8s/kustomization.yaml), never :latest.

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pic-api
            context: backend
          - name: pic-web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lower case)
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NEXT_PUBLIC_PIC_ENV=production
          tags: |
            ${{ steps.image.outputs.ref }}:${{ github.sha }}
            ${{ steps.image.outputs.ref }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
