name: Security

# TD §14 (OWASP ASVS L2; SAST / DAST / SCA in CI):
#   secrets  — gitleaks over the full git history (blocking)
#   codeql   — SAST for Python and JavaScript/TypeScript (results in the Security tab; blocking on the default query suite)
#   zap      — OWASP ZAP baseline + API scan against the API started from docker-compose (report-only for now)
# SCA (pip-audit / npm audit) runs in ci.yml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"   # weekly, Monday 02:17 UTC (07:47 IST): new advisories against unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for repositories owned by an organisation (free licence from gitleaks.io).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - backend/venv
              - frontend/node_modules
              - tests/load
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  zap:
    runs-on: ubuntu-latest
    # Report-only: findings are uploaded as artifacts and do not fail the build yet. Make it blocking
    # (fail_action: true, remove continue-on-error) once the baseline is triaged into .zap/rules.tsv.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets for the scan stack
        run: |
          {
            echo "POSTGRES_USER=pic"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=pic"
            echo "PIC_JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "PIC_FIELD_KEY=$(python3 -c 'import secrets,base64;print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
            echo "PIC_SEED_PASSWORD=$(openssl rand -hex 12)Aa1!"
            # Production-like surface (no legacy routes, rate limiting on) but OpenAPI on, so ZAP can import the API definition.
            echo "PIC_ENV=ci-scan"
            echo "PIC_ENABLE_LEGACY_DEMO=false"
            echo "PIC_API_DOCS=true"
            echo "PIC_RATE_LIMIT_PER_IP=100000"
            echo "PIC_RATE_LIMIT_PER_USER=100000"
            echo "PIC_CORS_ORIGINS="
            echo "PIC_METRICS_TOKEN=$(openssl rand -hex 24)"
          } > .env
      - name: Start database and API
        run: |
          docker compose --profile local-db up -d --build db api
          docker compose --profile local-db run --rm migrate
          docker compose --profile local-db run --rm api python -m app.pic.seed > /dev/null
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz; then break; fi
            sleep 2
          done
      - name: ZAP baseline (passive)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8080/docs
          cmd_options: "-a -j"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline
      - name: ZAP API scan (OpenAPI definition)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://127.0.0.1:8080/openapi.json
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api
      - name: API logs
        if: always()
        run: docker compose --profile local-db logs api | tail -200
      - name: Stop
        if: always()
        run: docker compose --profile local-db down -v
