title = "PIC gitleaks configuration"

[extend]
useDefault = true

# Reviewed false positives only. Every entry says why; a real secret is rotated and removed, never listed here.

[[allowlists]]
description = "Test fixtures: throw-away keys, passwords and settings that exist only to exercise the code under test"
paths = ['''backend/tests/''']

[[allowlists]]
description = "ai_eval.py compares metric names (key == \"forecast...\"), no credential"
paths = ['''backend/app/pic/tools/ai_eval.py''']

[[allowlists]]
description = "Old prototype commits: the public FastAPI-tutorial example signing key (removed from the code on 2 Nov 2026; legacy demo only) and a UI placeholder"
regexes = [
  '''09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7''',
  '''sec_live_99a812''',
]

[[allowlists]]
description = "docs/PIC_Workflow_Flow_Audit.md quotes API responses: c9fd077742b81f24a086 is the duplicate-supplier cluster key of the demo Shakti Forge pair (a hash of the normalised name), no credential"
regexes = ['''c9fd077742b81f24a086''']
