# Secrets: GCP Secret Manager -> External Secrets Operator -> Kubernetes Secret "pic-secrets".
#
# Requires External Secrets Operator >= 0.16 (API external-secrets.io/v1). On older releases change the
# apiVersion of both objects to external-secrets.io/v1beta1.
#
# Authentication is GKE Workload Identity: ESO requests a token for the KSA "pic-external-secrets" below, which
# is bound (roles/iam.workloadIdentityUser) to the Google service account created by Terraform
# (output eso_gsa_email). That GSA has roles/secretmanager.secretAccessor on the four PIC secrets only.
#
# The secret VALUES never live in git: add them to Secret Manager out-of-band (see deploy/README.md).
# Without ESO you can create the same Secret by hand:
#   kubectl -n pic create secret generic pic-secrets --from-literal=DATABASE_URL=... (etc.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pic-external-secrets
  labels:
    app.kubernetes.io/name: pic-external-secrets
  annotations:
    # PLACEHOLDER: terraform output eso_gsa_email (pic-eso-<environment>@<project-id>.iam.gserviceaccount.com)
    iam.gke.io/gcp-service-account: pic-eso-prod@your-gcp-project-id.iam.gserviceaccount.com
automountServiceAccountToken: false
---
# Namespaced store (rather than a ClusterSecretStore) so only the pic namespace can read PIC secrets.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: your-gcp-project-id # PLACEHOLDER: project that holds the secrets
      auth:
        workloadIdentity:
          clusterLocation: asia-south1 # PLACEHOLDER if the cluster region differs
          clusterName: pic-prod # PLACEHOLDER: terraform var.cluster_name
          clusterProjectID: your-gcp-project-id # PLACEHOLDER
          serviceAccountRef:
            name: pic-external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pic-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: pic-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: pic-database-url
        version: latest
    - secretKey: PIC_JWT_SECRET
      remoteRef:
        key: pic-jwt-secret
        version: latest
    - secretKey: PIC_FIELD_KEY
      remoteRef:
        key: pic-field-key
        version: latest
    - secretKey: PIC_METRICS_TOKEN
      remoteRef:
        key: pic-metrics-token
        version: latest
