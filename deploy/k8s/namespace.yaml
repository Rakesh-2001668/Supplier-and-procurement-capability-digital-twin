apiVersion: v1
kind: Namespace
metadata:
  name: pic
  labels:
    # Every PIC pod satisfies the "restricted" Pod Security Standard (non-root, no privilege escalation,
    # all capabilities dropped, RuntimeDefault seccomp). Enforce it so a regression is rejected at admission.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
