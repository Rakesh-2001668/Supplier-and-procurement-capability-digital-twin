# One identity per workload. None of the PIC containers talk to the Kubernetes API, so token automount is off.
# They do not use Workload Identity either (no GCP API calls); only the External Secrets KSA in
# external-secret.yaml is bound to a Google service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pic-api
  labels:
    app.kubernetes.io/name: pic-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pic-worker
  labels:
    app.kubernetes.io/name: pic-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pic-web
  labels:
    app.kubernetes.io/name: pic-web
automountServiceAccountToken: false
